name: opencode

on:
  issue_comment:
    types: [created]

jobs:
  opencode:
    # 🔒 SOLO EJECUTA SI ES EXPLÍCITO
    if: contains(github.event.comment.body, '/opencode run')

    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Run OpenCode (controlled mode)
        uses: anomalyco/opencode/github@latest
        with:
          model: anthropic/claude-sonnet-4-20250514
          use_github_token: true
